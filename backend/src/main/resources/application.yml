spring:
  application:
    name: backend
  profiles:
    # 当前生效的环境配置
    active: dev
  # 数据库数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
  data:
    # Redis 配置
    redis:
      lettuce:
        pool:
          # 最大连接
          max-active: 8
          # 最大空闲连接
          max-idle: 8
          # 最小空闲连接
          min-idle: 0
          # 等待时间
          max-wait: 100ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis:
  configuration:
    # 开启驼峰映射
    map-underscore-to-camel-case: true
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: top.lhlnb.backend.domain.entity

# 跨域配置
cors:
  allowed-origins:
    - GET
    - POST
    - PUT
    - DELETE
  allowed-headers:
    - Content-Type
    - Authorization
    - X-Requested-With
    - X-Forwarded-For
    - X-Real-IP
  allow-credentials: true