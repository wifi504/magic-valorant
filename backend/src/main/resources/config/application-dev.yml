server:
  port: 8080

spring:
  # 数据库数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/magic_valorant
    username: root
    password: 1234
  data:
    # Redis 配置
    redis:
      host: 127.0.0.1
      port: 6379
      password: 1234
      database: 0

# 跨域配置
cors:
  # 允许访问的源
  allowed-origins: http://localhost:5173/

# 日志配置
logging:
  level:
    root: info
  custom:
    # 日志文件夹路径
    path: ./logs
    # 单个日志文件最大大小
    max-file-size: 100MB
    # 保留天数（默认 -1 表示永久保留）
    max-history: -1

jwt:
  # JWT 密钥
  secret: test-secret
  # 默认有效期(秒)
  ttl: 60